<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="BESIANA Sh.P.K. — distributor i produkteve CYCLON në Kosovë. Diçka e re po vjen."
  >

  <meta name="theme-color" content="#F5F2EA">

  <title>BESIANA Sh.P.K. — Së shpejti</title>

  <style>
    /* =====================================================
       BESIANA SH.P.K.
       COMING SOON LANDING PAGE
       ===================================================== */

    :root {
      --background: #F5F2EA;
      --black: #111111;
      --grey: #74716B;
      --line: rgba(17, 17, 17, 0.18);
      --orbit-time: 8s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: var(--background);
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      background: var(--background);
      color: var(--black);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      padding:
        max(20px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
    }

    /* =====================================================
       DECORATIVE SIDE DETAILS
       ===================================================== */

    .side-line {
      position: fixed;

      top: 50%;

      width: 1px;
      height: 70px;

      background: var(--line);

      transform: translateY(-50%);

      pointer-events: none;
    }

    .side-line-left {
      left: 32px;
    }

    .side-line-right {
      right: 32px;
    }

    .corner-number {
      position: fixed;

      font-size: 9px;
      font-weight: 600;

      letter-spacing: 0.16em;

      color: rgba(17, 17, 17, 0.38);

      pointer-events: none;
    }

    .corner-number-left {
      left: 28px;
      bottom: 28px;
    }

    .corner-number-right {
      right: 28px;
      top: 28px;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    header {
      position: relative;
      z-index: 10;

      width: 100%;

      min-height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .soon-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      color: var(--grey);

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.2em;

      text-transform: uppercase;
    }

    .soon-label::before {
      content: "";

      display: block;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--black);
    }

    /* =====================================================
       MAIN
       ===================================================== */

    main {
      position: relative;
      z-index: 2;

      flex: 1;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 0;
    }

    /* =====================================================
       ORBIT
       ===================================================== */

    .orbit {
      position: relative;

      width: min(430px, 72vw);
      height: min(430px, 72vw);

      border: 1px solid var(--black);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-spinner {
      position: absolute;

      inset: -1px;

      border-radius: 50%;

      animation:
        orbit-spin
        var(--orbit-time)
        linear
        infinite;

      will-change: transform;

      pointer-events: none;
    }

    .orbit-dot {
      position: absolute;

      top: -5px;
      left: 50%;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: var(--black);

      transform: translateX(-50%);

      box-shadow:
        0 0 0 3px
        rgba(245, 242, 234, 0.75);
    }

    @keyframes orbit-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       CENTRAL CONTENT
       ===================================================== */

    .identity {
      position: relative;
      z-index: 5;

      width: 76%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    /* =====================================================
       LOGO
       ===================================================== */

    .logo-wrapper {
      width: 120px;

      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      display: block;

      max-width: 100%;
      max-height: 72px;

      object-fit: contain;

      filter:
        grayscale(1)
        brightness(0);
    }

    .company-name {
      margin-bottom: 24px;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 0.18em;

      text-transform: uppercase;
    }

    /* =====================================================
       HEADLINE
       ===================================================== */

    h1 {
      max-width: 330px;

      margin-bottom: 20px;

      font-family:
        "Arial Narrow",
        Arial,
        Helvetica,
        sans-serif;

      font-size: clamp(34px, 4vw, 52px);
      font-weight: 500;

      line-height: 0.98;

      letter-spacing: -0.055em;
    }

    .description {
      max-width: 310px;

      margin-bottom: 25px;

      color: var(--grey);

      font-size: 13px;
      font-weight: 400;

      line-height: 1.65;

      letter-spacing: -0.01em;
    }

    /* =====================================================
       CONTACT
       ===================================================== */

    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 7px;
    }

    .contact-label {
      color: var(--grey);

      font-size: 9px;
      font-weight: 600;

      letter-spacing: 0.18em;

      text-transform: uppercase;
    }

    .phone {
      position: relative;

      display: inline-block;

      padding: 6px 0 8px;

      color: var(--black);

      font-size: 14px;
      font-weight: 600;

      letter-spacing: 0.02em;

      text-decoration: none;
    }

    .phone::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: 2px;

      width: 100%;
      height: 1px;

      background: var(--black);

      transform: scaleX(0.24);
      transform-origin: left center;

      transition: transform 280ms ease;
    }

    .phone:hover::after {
      transform: scaleX(1);
    }

    .phone:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 5px;
    }

    .phone:focus-visible::after {
      transform: scaleX(1);
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      position: relative;
      z-index: 10;

      width: 100%;

      min-height: 50px;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    footer p {
      color: var(--grey);

      font-size: 10px;
      font-weight: 500;

      letter-spacing: 0.04em;
    }

    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 900px) {
      .orbit {
        width: min(390px, 76vw);
        height: min(390px, 76vw);
      }
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {
      .page {
        padding:
          max(15px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(15px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      header {
        min-height: 42px;
      }

      .soon-label {
        font-size: 9px;

        letter-spacing: 0.17em;
      }

      .hero {
        padding: 24px 0;
      }

      .orbit {
        width: min(325px, 85vw);
        height: min(325px, 85vw);
      }

      .identity {
        width: 79%;
      }

      .logo-wrapper {
        width: 90px;

        margin-bottom: 15px;
      }

      .logo-wrapper img {
        max-height: 55px;
      }

      .company-name {
        margin-bottom: 18px;

        font-size: 10px;

        letter-spacing: 0.15em;
      }

      h1 {
        max-width: 230px;

        margin-bottom: 15px;

        font-size: clamp(29px, 8.5vw, 37px);

        line-height: 1;
      }

      .description {
        max-width: 235px;

        margin-bottom: 18px;

        font-size: 11px;

        line-height: 1.55;
      }

      .contact-label {
        font-size: 8px;
      }

      .phone {
        font-size: 12px;
      }

      footer {
        min-height: 38px;
      }

      footer p {
        font-size: 9px;
      }

      .side-line,
      .corner-number {
        display: none;
      }

      .orbit-dot {
        width: 9px;
        height: 9px;

        top: -4.5px;
      }
    }

    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-width: 360px) {
      .orbit {
        width: min(290px, 87vw);
        height: min(290px, 87vw);
      }

      h1 {
        max-width: 200px;

        font-size: 27px;
      }

      .description {
        max-width: 205px;

        font-size: 10px;
      }

      .company-name {
        font-size: 9px;
      }
    }

    /* =====================================================
       SHORT SCREENS
       ===================================================== */

    @media (max-height: 690px) and (min-width: 601px) {
      .orbit {
        width: min(350px, 64vh);
        height: min(350px, 64vh);
      }

      header,
      footer {
        min-height: 35px;
      }

      .hero {
        padding: 15px 0;
      }

      .logo-wrapper {
        width: 85px;

        margin-bottom: 10px;
      }

      .company-name {
        margin-bottom: 12px;
      }

      h1 {
        margin-bottom: 12px;

        font-size: 32px;
      }

      .description {
        margin-bottom: 12px;

        font-size: 11px;
      }
    }

    /* =====================================================
       LANDSCAPE PHONE
       ===================================================== */

    @media (max-height: 500px) and (orientation: landscape) {
      .orbit {
        width: min(300px, 68vh);
        height: min(300px, 68vh);
      }

      .logo-wrapper {
        display: none;
      }

      .company-name {
        margin-bottom: 8px;

        font-size: 9px;
      }

      h1 {
        margin-bottom: 8px;

        font-size: 25px;
      }

      .description {
        max-width: 220px;

        margin-bottom: 8px;

        font-size: 9px;

        line-height: 1.4;
      }

      .contact-label {
        display: none;
      }

      .phone {
        font-size: 10px;
      }
    }

    /* =====================================================
       REDUCED MOTION ACCESSIBILITY
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .orbit-spinner {
        animation: none;
      }

      .phone::after {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- Decorative details -->
    <span
      class="side-line side-line-left"
      aria-hidden="true"
    ></span>

    <span
      class="side-line side-line-right"
      aria-hidden="true"
    ></span>

    <span
      class="corner-number corner-number-left"
      aria-hidden="true"
    >
      01
    </span>

    <span
      class="corner-number corner-number-right"
      aria-hidden="true"
    >
      BESIANA / 2026
    </span>


    <!-- HEADER -->
    <header>
      <div class="soon-label">
        Së shpejti
      </div>
    </header>


    <!-- MAIN -->
    <main>

      <section
        class="hero"
        aria-labelledby="main-title"
      >

        <div class="orbit">

          <!--
            This layer rotates continuously.
            The black dot travels around the circle.
          -->
          <div
            class="orbit-spinner"
            aria-hidden="true"
          >
            <span class="orbit-dot"></span>
          </div>


          <!-- CENTER CONTENT -->
          <div class="identity">

            <!--
              IMPORTANT:

              Put your BESIANA logo in the SAME folder
              as this index.html file.

              Name the logo:

              besiana-logo.png

              OR change the filename below.
            -->

            <div class="logo-wrapper">
              <img
                src="besiana-logo.png"
                alt="BESIANA Sh.P.K. logo"
              >
            </div>


            <p class="company-name">
              BESIANA Sh.P.K.
            </p>


            <h1 id="main-title">
              Diçka e re po vjen.
            </h1>


            <p class="description">
              BESIANA Sh.P.K. — distributor i produkteve
              CYCLON në Kosovë.
            </p>


            <div class="contact">

              <span class="contact-label">
                Kontakt
              </span>

              <a
                class="phone"
                href="tel:+38344303130"
                aria-label="Telefono BESIANA Sh.P.K. në numrin +383 44 303 130"
              >
                +383 44 303 130
              </a>

            </div>

          </div>

        </div>

      </section>

    </main>


    <!-- FOOTER -->
    <footer>
      <p>
        © 2026 BESIANA Sh.P.K.
      </p>
    </footer>

  </div>

</body>
</html>
